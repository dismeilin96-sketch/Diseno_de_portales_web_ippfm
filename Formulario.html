<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario</title>
</head>
<body>
<h1>Formulario</h1>
<h4>Por favor rellene todo el formulario</h4>
<form>
    <label for="Name">Nombre</label>
    <input type="text" name="Nombre" id="Name"><br><br>
    <label for="Numero de Telefono">Numero de Telefono</label>
    <input type="tel" name="Numero de Telefono" id="Numero de Telefono"><br> <br>
    <label for="Correo Electronico">Correo Electronico</label>
    <input type="email" name="Correo Electronico" id="Correo Electronico"><br><br>
    <label for="Fecha de nacimiento">Fecha de nacimiento</label>
    <input type="date" name="Fecha de nacimiento" id="Fecha de nacimiento"><br><br>
    <label for="Ciudad">Ciudad</label>
    <select name="Ciudad" id="Ciudad">
        <option value="Santigo">Santigo</option>
        <option value="Santo Domingo">Santo Domingo</option>
        <option value="San Pedro de Macoris">San Pedro de Macoris</option>
        <option value="Puerto Plata">Puerto Plata</option>
        <option value="La Romana">La Romana</option>
    </select><br><br>
    <label for="Genero">Genero</label>
   <label for="Femenino">Femenino</label>
    <input type="radio" name="Femenino" id="Femenino"><br>
    <label for="Masculino">Masculino</label>
    <input type="radio" name="Masculino" id="Masculino"><br><br>
    <label for="Pasatiempos">Pasatiempos</label>
    <label for="Lectura">Lectura</label>
    <input type="checkbox" name="Lectura" id="Lectura"><br>
    <label for="Senderismo">Senderismo</label>
    <input type="checkbox" name="Senderismo" id="Senderismo"><br>
    <label for="repostería">repostería</label>
    <input type="checkbox" name="repostería" id="repostería"><br>
    <label for="pintura">pintura</label>
    <input type="checkbox" name="pintura" id="pintura"><br>
    <label for="Jardinería">Jardinería</label>
    <input type="checkbox" name="Jardinería" id="Jardinería"><br><br>
    <label for="Direccion">Direccion</label>
    <textarea name="Direccion" id="Direccion" cols="21" rows="10"></textarea><br>
    <label for="Enviar"></label>
    <input type="submit" value="Enviar Formulario">
</form>
</body>
</html>
